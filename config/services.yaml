# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    default_log_spool_path: '%kernel.project_dir%/var/log-spool'
    default_log_browse_page_size: 50
    default_log_visibility_flush_seconds: 5

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DataFixtures/'
            - '../src/Dto/'

    App\Command\SamlImportMetadataCommand:
        arguments:
            $defaultUri: '%env(DEFAULT_URI)%'

    App\Service\EncryptionService:
        arguments:
            $encryptionKey: '%env(APP_ENCRYPTION_KEY)%'

    App\Service\BatchWindowCalculator:
        arguments:
            $windowMinutes: '%env(int:LOG_BATCH_WINDOW_MINUTES)%'

    App\Service\SpoolProvider:
        arguments:
            $spoolPath: '%env(default:default_log_spool_path:LOG_SPOOL_PATH)%'

    App\Controller\DashboardController:
        arguments:
            $logBrowsePageSize: '%env(int:default:default_log_browse_page_size:LOG_BROWSE_PAGE_SIZE)%'

    App\Command\SyslogListenCommand:
        arguments:
            $visibilityFlushSeconds: '%env(int:default:default_log_visibility_flush_seconds:LOG_VISIBILITY_FLUSH_SECONDS)%'

    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '%env(resolve:DATABASE_URL)%'
            - { db_table: 'sessions', db_id_col: 'sess_id', db_data_col: 'sess_data', db_time_col: 'sess_time', db_lifetime_col: 'sess_lifetime' }

when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\DataFixtures\:
            resource: '../src/DataFixtures/'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\DataFixtures\:
            resource: '../src/DataFixtures/'
